services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    command: sh -c "node dist/database/migrate.cli.js && node dist/database/seed.cli.js && node dist/main.js"
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      PORT: 3000
      SERVICE_NAME: shop-core
      LOG_LEVEL: info
      SUPPLIER_A_URL: http://supplier-a:4001
      SUPPLIER_B_URL: http://supplier-b:4002
      SUPPLIER_TIMEOUT_MS: 1500
      SUPPLIER_RETRIES: 2
      SUPPLIER_BACKOFF_BASE_MS: 100
      WORKER_ENABLED: "true"
      WORKER_POLL_INTERVAL_MS: 200
      WORKER_CONCURRENCY: 4
      STUCK_ORDER_AGE_MS: 2000
      SEED_PERF_SKUS: 5000
      DELIVERY_MAX_ATTEMPTS: 12
    ports:
      - "3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  supplier-a:
    build: .
    restart: unless-stopped
    command: node dist/supplier/main.supplier.js
    environment:
      SERVICE_NAME: supplier-a
      SUPPLIER_ID: A
      SUPPLIER_PORT: 4001
      SUPPLIER_EXTRA_KEYS_PER_SKU: 40
    ports:
      - "4001:4001"

  supplier-b:
    build: .
    restart: unless-stopped
    command: node dist/supplier/main.supplier.js
    environment:
      SERVICE_NAME: supplier-b
      SUPPLIER_ID: B
      SUPPLIER_PORT: 4002
      SUPPLIER_EXTRA_KEYS_PER_SKU: 40
    ports:
      - "4002:4002"
